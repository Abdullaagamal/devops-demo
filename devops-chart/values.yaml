# Default values for devops-chart — the single tuning panel for all environments.

replicaCount: 2

image:
  repository: ghcr.io/abdullaagamal/devops-demo
  tag: latest
  pullPolicy: Always

service:
  type: NodePort
  port: 3000
  targetPort: 3000
  nodePort: 30000

ingress:
  enabled: true
  className: nginx
  host: devops-demo.local

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

probes:
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 10

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  allowPrivilegeEscalation: false